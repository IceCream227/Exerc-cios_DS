<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar navbar-black bg-primary">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 text-light">Prontuário Eletrônico</span>
        </div>
    </nav>

    <div class="container mt-4">
        <form onsubmit="mostrarDados(); return false;">
            <div class="card mb-4">
                <div class="card-header bg-info text-light text-center">
                    Dados do Paciente
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Nome</label><br>
                            <input id="nome" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Idade</label><br>
                            <input id="idade" type="number" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Sexo</label>
                            <select id="sexo" class="form-select" aria-label="Default select example" required>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Woke">Woke</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-info text-light text-center">
                    Sinais Vitais
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label>Pressão Arterial</label><br>
                            <input id="pressao" type="text" placeholder="Ex: 120/80" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Temperatura</label><br>
                            <input id="temp" type="number" placeholder="Ex: 37.0 ºC" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Frquência Cardíaca</label><br>
                            <input id="freq" type="number" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Saturação</label><br>
                            <input id="sat" type="number" placeholder="%" class="form-control" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-info text-light text-center">
                    Evolução do Paciente
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label>Descreva a Evolução</label><br>
                        <textarea id="ev" class="form-control"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="card mb-4">
                <div class="card-header bg-info text-center text-light">
                    Medicação
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Medicamento</label><br>
                            <input id="med" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Dosagem</label><br>
                            <input id="dos" type="text" class="form-control" placeholder="Ex: 3mg" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Horário</label><br>
                            <input id="hor" type="time" class="form-control" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-end mb-5">
                <button class="btn btn-primary" type="submit">Salvar Prontuário</button>
            </div>
        </form>
    </div>

    <div class="toast position-fixed bottom-0 end-0 p-3" id="toastSuccess">
        <div class="toast-header">
            <strong class="me-auto">Sistema</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">
            Prontuário salvo com sucesso!
        </div>
    </div>

        <div id="resultado" class="alert alert-secondary d-none text-center"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function mostrarDados(){
            let nome = document.getElementById("nome").value;
            let idade = document.getElementById("idade").value;
            let sexo = document.getElementById("sexo").value;
            let pressao = document.getElementById("pressao").value;
            let temp = document.getElementById("temp").value;
            let freq = document.getElementById("freq").value;
            let sat = document.getElementById("sat").value;
            let ev = document.getElementById("ev").value;
            let med = document.getElementById("med").value;
            let dos = document.getElementById("dos").value;
            let hor = document.getElementById("hor").value;

            let resultado = `
            <h5>Prontuário do Paciente</h5>
            <p>Nome: ${nome}<br>
            Idade: ${idade}<br>
            Sexo: ${sexo}<br>
            Pressão Arterial: ${pressao}<br>
            Temperatura: ${temp}<br>
            Frquência Cardíaca: ${freq}<br>
            Saturação: ${sat}<br>
            Evolução: ${ev}<br>
            Medicamento: ${med}<br>
            Dosagem: ${dos}<br>
            Horário: ${hor}</p>
            `;
            let caixa = document.getElementById("resultado");
            caixa.innerHTML = resultado;
            caixa.classList.remove("d-none");

            let toast = new bootstrap.Toast(document.getElementById('toastSuccess'));
            toast.show();
        }
    </script>
</body>
</html>
