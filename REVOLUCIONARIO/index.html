<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLK - A Dream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    @font-face {
        font-family: 'MLKFont';
        src: url('wolfsbane2ii.ttf') format('truetype');
    }

    h1 {
        font-family: 'MLKFont', sans-serif;
        font-size: 5rem;
    }

    p, label {
        font-family: 'MLKFont', sans-serif;
        font-size: 2rem;
    }
</style>

<body class="bg-black">
    <section class="text-white mt-5 d-flex flex-column justify-content-center align-items-center">
        <div class="d-flex flex-row align-items-center gap-3 mb-4">
            <img src="PunhoBlackPhanter.png" alt="simboloBlackPhanter" style="width: 80px; height: 80px;"
                class="rounded-circle">
            <h1 class="m-0">MLK</h1>
        </div>
        <div class="d-flex flex-column justify-content-center align-items-center gap-3" style="height: 500px; width: 300px; border-radius: 10px; background-color: #1f1f1f">
            <form class="text-center" id="formulario">
                <label for="name">Name</label><br>
                <input type="text" name="name" id="name" placeholder="Enter your name" class="form-control"><br>
                <label for="email">Email</label><br>
                <input type="email" name="email" id="email" placeholder="Enter your email" class="form-control"><br>
                <label for="password">Password</label><br>
                <input type="password" name="password" id="password" placeholder="Enter your password" class="form-control"><br><br>
                <button type="submit" onclick="validarForm()" class="btn btn-outline-white text-white border-white" style="width: 10rem; padding: 10px;">Sign Up</button>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        function validarForm(){
            const nome = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;

            let usuários = [
                {nome: 'John Doe', email: 'johndoe@gmail.com', senha: 'senha123'},
                {nome: 'Jane Doe', email: 'janedoe@gmail.com', senha: 'senha456'}
            ];

            for(let i=0; i<usuários.length; i++){
                if (nome === usuários[i].nome && email === usuários[i].email && senha === usuários[i].senha){
                    alert('Cadastro realizado com sucesso!');
                    return;
                }
            }
            alert('Dados inválidos!');
        }
    </script>
</body>
</html>
